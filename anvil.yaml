allow_embedding: false
db_schema:
  survey_responses:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: sleep_hours
      type: number
    - admin_ui: {order: 1, width: 200}
      client_hidden: false
      name: weight_Kg
      type: number
    - admin_ui: {order: 2, width: 200}
      client_hidden: false
      name: caffeine_mg_per_day
      type: number
    - admin_ui: {order: 3, width: 200}
      client_hidden: false
      name: height_feet
      type: number
    - admin_ui: {order: 4, width: 200}
      client_hidden: false
      name: meals_per_day
      type: number
    - admin_ui: {order: 5, width: 200}
      client_hidden: false
      name: sleep_quality
      type: number
    - admin_ui: {order: 6, width: 200}
      client_hidden: true
      name: submitted_at
      type: datetime
    - admin_ui: {order: 7, width: 200}
      client_hidden: true
      name: user
      target: users
      type: link_single
    indexes: []
    server: full
    title: survey_responses
  users:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: email
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: true
      name: enabled
      type: bool
    - admin_ui: {order: 2, width: 200}
      client_hidden: true
      name: last_login
      type: datetime
    - admin_ui: {order: 3, width: 200}
      client_hidden: true
      name: password_hash
      type: string
    - admin_ui: {order: 4, width: 200}
      client_hidden: true
      name: n_password_failures
      type: number
    - admin_ui: {order: 5, width: 200}
      client_hidden: true
      name: confirmed_email
      type: bool
    indexes: []
    server: full
    title: Users
metadata: {title: Stellar Cycle}
name: 'Stellar Cycle  '
package_name: Stellar_Cycle__
runtime_options:
  client_version: '3'
  server_spec: {base: python310-minimal}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_signup: true, confirm_email: true, enable_automatically: true, use_email: true}
  server_config: {user_table: users}
  source: /runtime/services/anvil/users.yml
startup: {module: Form1, type: form}
