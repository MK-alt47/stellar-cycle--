<div class="schedule-grid-row">
  <div class="schedule-cell">
    <anvil-component type="Label" name="time_label" prop:role="schedule-cell-label" bind:text="self.item['time']"></anvil-component>
  </div>
  <div class="schedule-cell">
    <anvil-component type="Label" name="category_label" prop:role="schedule-cell-label" bind:text="self.item['category']"></anvil-component>
  </div>
  <div class="schedule-cell">
    <anvil-component type="Label" name="action_label" prop:role="schedule-cell-label" bind:text="self.item['action']"></anvil-component>
  </div>
</div>
