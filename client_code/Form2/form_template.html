<anvil-form layout="Stellar_Cycle__.Layouts.BaseLayout">
  <anvil-block slot="title">
    <anvil-component type="Label" name="form_title" prop:role="h1" prop:text="Wellness Survey"></anvil-component>
  </anvil-block>
  <anvil-block slot="content">
    <anvil-component type="ColumnPanel" name="survey_panel" prop:role="card">
      <anvil-component type="Label" name="intro_label" prop:text="Sign in or create an account, then answer these eight survey questions. Your password is handled securely by the account sign-in form."></anvil-component>
      <anvil-component type="Button" name="account_button" prop:text="Log in or sign up"></anvil-component>
      <anvil-component type="Label" name="account_status_label" prop:text="Sign in or create an account before saving your survey."></anvil-component>
      <anvil-component type="Label" name="progress_label" prop:text="Question 1 of 8"></anvil-component>
      <anvil-component type="Label" name="question_label" prop:role="h2"></anvil-component>
      <anvil-component type="Label" name="hint_label"></anvil-component>
      <anvil-component type="TextBox" name="answer_box" prop:type="text"></anvil-component>
      <anvil-component type="DropDown" name="answer_dropdown" prop:visible="false" prop:include_placeholder="true" prop:placeholder="Select an answer"></anvil-component>
      <anvil-component type="DropDown" name="weight_unit_dropdown" prop:visible="false" prop:include_placeholder="true" prop:placeholder="Choose kg or lb"></anvil-component>
      <anvil-component type="Button" name="back_button" prop:text="Back" prop:enabled="false"></anvil-component>
      <anvil-component type="Button" name="next_button" prop:text="Next"></anvil-component>
    </anvil-component>
  </anvil-block>
</anvil-form>
