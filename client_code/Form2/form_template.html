<anvil-form layout="Stellar_Cycle__.Layouts.BaseLayout">
  <anvil-block slot="title">
    <anvil-component type="Label" name="form_title" prop:role="h1" prop:text="Wellness Survey"></anvil-component>
  </anvil-block>
  <anvil-block slot="content">
    <anvil-component type="ColumnPanel" name="survey_panel" prop:role="card">
      <anvil-component type="Label" name="intro_label" prop:text="Sign in or create an account, then complete every field and save your response."></anvil-component>
      <anvil-component type="Button" name="account_button" prop:text="Log in or sign up"></anvil-component>
      <anvil-component type="Label" name="account_status_label" prop:text="Sign in or create an account before saving your survey."></anvil-component>
      <anvil-component type="Label" name="sleep_hours_label" prop:text="Average hours of sleep per night"></anvil-component>
      <anvil-component type="TextBox" name="sleep_hours_box" prop:placeholder="For example: 8"></anvil-component>
      <anvil-component type="Label" name="weight_kg_label" prop:text="Weight (kilograms)"></anvil-component>
      <anvil-component type="TextBox" name="weight_kg_box" prop:placeholder="For example: 70"></anvil-component>
      <anvil-component type="Label" name="caffeine_label" prop:text="Average caffeine consumed per day (milligrams)"></anvil-component>
      <anvil-component type="TextBox" name="caffeine_box" prop:placeholder="For example: 200"></anvil-component>
      <anvil-component type="Label" name="height_feet_label" prop:text="Height (decimal feet; for example, 5 ft 8 in is 5.67)"></anvil-component>
      <anvil-component type="TextBox" name="height_feet_box" prop:placeholder="For example: 5.67"></anvil-component>
      <anvil-component type="Label" name="meals_per_day_label" prop:text="Meals consumed per day (whole number)"></anvil-component>
      <anvil-component type="TextBox" name="meals_per_day_box" prop:placeholder="For example: 3"></anvil-component>
      <anvil-component type="Label" name="sleep_quality_label" prop:text="Sleep quality (1 = very poor, 10 = excellent)"></anvil-component>
      <anvil-component type="TextBox" name="sleep_quality_box" prop:placeholder="Enter a whole number from 1 to 10"></anvil-component>
      <anvil-component type="Button" name="submit_button" prop:text="Save survey response"></anvil-component>
    </anvil-component>
  </anvil-block>
</anvil-form>
